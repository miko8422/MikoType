deployment:
  target_os: "windows"
  topology: "single_host"

app:
  host: "127.0.0.1"
  port: 8765
  log_level: "INFO"

camera:
  source_id: "windows_main"
  # Media Foundation is the V0.1 default. Try "dshow", then "any" only if
  # the selected camera cannot open reliably on the target PC.
  backend: "msmf"
  device_index: 0
  width: 1280
  height: 720
  fps: 60
  rotate_degrees: 0
  mirror: false

stream:
  preview_type: "mjpeg"
  jpeg_quality: 80
  max_preview_fps: 30

pipeline:
  frame_policy: "latest"
  perception_enabled: true
  frame_wait_timeout_ms: 50
  stop_timeout_s: 5.0

hand_tracking:
  enabled: true
  num_hands: 2
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  metrics_acknowledged: false

keyboard_tracking:
  enabled: true
  dictionary: "DICT_4X4_50"
  smoothing_alpha: 0.38
  max_coast_ms: 800.0
  min_pose_confidence: 0.25
  min_hand_confidence: 0.35
  top_k: 3
  direct_weight: 0.35
  experimental: true

interaction:
  neighbor_glow_enabled: true
  neighbor_glow_scale: 0.55
  direct_min_intensity: 0.35

artifacts:
  layout_profile: "../data/keyboards/kzzi_user_adjustable_82/layout.json"
  anchor_reference: "../data/keyboards/kzzi_user_adjustable_82/anchor_reference.json"
  contact_map: "../data/keyboards/kzzi_user_adjustable_82/contact_map.json"
  model_glb: "../data/keyboards/kzzi_user_adjustable_82/adaptive_keyboard.glb"
  model_manifest: "../data/keyboards/kzzi_user_adjustable_82/adaptive_keyboard_manifest.json"

debug_ui:
  enabled: true
  mirror_preview: true
  websocket_state: true
  expose_model_download: true

diagnostics:
  stale_frame_threshold_ms: 500
  metrics_interval_ms: 1000

# Reserved post-V0.1 boundary. The production runtime refuses to enable this
# block so camera, inference, FastAPI, and VR state stay on this Windows host.
remote_inference:
  enabled: false
  transport: "websocket"
  endpoint: null
  token_env: "MIKOTYPE_REMOTE_INFERENCE_TOKEN"
  require_tls: true
  max_frame_bytes: 4194304
  max_in_flight: 1
  response_timeout_ms: 1000
